apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.greenrobot.greendao'
apply plugin: 'kotlin-parcelize'
apply plugin: "de.timfreiheit.resourceplaceholders"
apply plugin: 'kotlin-kapt'

def name = "YueDuLite"
def version = "1.0"

// 签名：优先读根目录下不入库的 keystore.properties（自己的正式签名），
// 没有该文件时退回仓库自带的演示签名，保证 clone 下来直接就能构建。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signStoreFile = keystoreProps.getProperty('RELEASE_STORE_FILE')
        ?: (project.findProperty('RELEASE_STORE_FILE') ?: './key.properties.jks')
def signStorePassword = keystoreProps.getProperty('RELEASE_STORE_PASSWORD')
        ?: (project.findProperty('RELEASE_STORE_PASSWORD') ?: 'android')
def signKeyAlias = keystoreProps.getProperty('RELEASE_KEY_ALIAS')
        ?: (project.findProperty('RELEASE_KEY_ALIAS') ?: 'key0')
def signKeyPassword = keystoreProps.getProperty('RELEASE_KEY_PASSWORD')
        ?: (project.findProperty('RELEASE_KEY_PASSWORD') ?: 'android')

android {
    compileSdkVersion 31
    signingConfigs {
        myConfig {
            storeFile file(signStoreFile)
            storePassword signStorePassword
            keyAlias signKeyAlias
            keyPassword signKeyPassword
        }
    }

    defaultConfig {
        // 独立包名：避免覆盖安装原版/阅读Omega，可与它们共存
        applicationId "com.acilu233.yuedulite"
        minSdkVersion 19
        targetSdkVersion 31
        versionCode 1
        versionName version
        project.ext.set("archivesBaseName", name + "_" + version)
        multiDexEnabled true

    }
    buildFeatures {
        viewBinding true
    }
    lintOptions {
        abortOnError false
    }
    buildTypes {
        release {
            signingConfig signingConfigs.myConfig
            // 4.4 设备上 dex 体积直接决定类加载耗时：开 R8 + 资源压缩
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.myConfig
            applicationIdSuffix '.debug'
            versionNameSuffix 'debug'
            // 调试包也开混淆，这样在真机上量到的就是最终形态（同包名可覆盖安装）
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        android.applicationVariants.all { variant ->
            variant.outputs.all {
                outputFileName = "${name}_${defaultConfig.versionName}.apk"
            }
        }
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    buildToolsVersion '30.0.3'
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked"
        //options.compilerArgs << "-Xlint:deprecation"
    }
}

resourcePlaceholders {
    files = ['xml/shortcuts.xml']
}

// 4.4(API19)：其他依赖（glide/retrofit 等）可能传递进来 OkHttp 4.x/5.x，
// 那会在第一次建 OkHttpClient 时因 "Expected Android API level 21+" 崩溃，这里强制压到 3.12.13
configurations.all {
    resolutionStrategy {
        force 'com.squareup.okhttp3:okhttp:3.12.13'
        force 'com.squareup.okio:okio:1.17.5'
    }
    exclude group: 'com.squareup.okhttp3', module: 'okhttp-android'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'
    testImplementation 'junit:junit:4.13.2'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':basemvplib')
    implementation('androidx.multidex:multidex:2.0.1')
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version")
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    //协程
    def coroutines_version = '1.6.0'
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version")

    //anko
    def anko_version = '0.10.8'
    implementation "org.jetbrains.anko:anko-sdk27:$anko_version"
    implementation "org.jetbrains.anko:anko-sdk27-listeners:$anko_version"

    //lifecycle
    def lifecycle_version = '2.4.1'
    implementation("androidx.lifecycle:lifecycle-common-java8:$lifecycle_version")

    //androidX
    implementation('androidx.appcompat:appcompat:1.4.1')
    implementation('androidx.core:core-ktx:1.7.0')
    implementation("androidx.activity:activity-ktx:1.4.0")
    implementation("androidx.fragment:fragment-ktx:1.4.1")
    implementation('androidx.preference:preference-ktx:1.2.0')
    implementation('androidx.constraintlayout:constraintlayout:2.1.3')
    implementation('androidx.swiperefreshlayout:swiperefreshlayout:1.1.0')
    implementation('androidx.viewpager2:viewpager2:1.0.0')
    implementation('com.google.android.material:material:1.5.0')
    implementation('com.google.android.flexbox:flexbox:3.0.0')
    implementation('com.google.code.gson:gson:2.9.0')
    implementation('androidx.webkit:webkit:1.4.0')

    //Splitties
    def splitties_version = '3.0.0'
    implementation("com.louiscad.splitties:splitties-appctx:$splitties_version")
    implementation("com.louiscad.splitties:splitties-systemservices:$splitties_version")
    implementation("com.louiscad.splitties:splitties-views:$splitties_version")

    //media（仅保留 MediaSessionCompat，用于朗读通知栏控制；ExoPlayer/有声书已移除）
    implementation("androidx.media:media:1.5.0")
    // OkHttp 固定 4.9.2（Kotlin API，纯 jar 不带 minSdk 约束；且元数据与本工程 Kotlin 1.6 兼容，
    // 4.12 是 Kotlin 1.9 编译的，会报 "Incompatible classes were found in dependencies"）
    // 4.4(API19)：OkHttp 4.x/5.x 的 AndroidPlatform 要求 API21+，必须用 3.12.x（最后一个支持 19 的版本）
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.squareup.okio:okio:1.17.5'

    //google
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'com.google.code.gson:gson:2.9.0'

    //RxAndroid
    implementation 'io.reactivex.rxjava2:rxjava:2.2.19'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    //RxBus
    implementation 'com.hwangjr.rxbus:rxbus:2.0.1'

    //Retrofit
    //noinspection GradleDependency
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'

    //J_SOUP
    implementation 'org.jsoup:jsoup:1.14.3'
    implementation 'cn.wanghaomiao:JsoupXpath:2.5.1'
    implementation 'com.jayway.jsonpath:json-path:2.7.0'

    //JS
    //noinspection GradleDependency
    implementation 'com.github.gedoor:rhino-android:1.3'

    //GreenDao
    implementation 'org.greenrobot:greendao:3.3.0'
    implementation 'com.github.yuweiguocn:GreenDaoUpgradeHelper:v2.2.1'

    //Glide
    implementation 'com.github.bumptech.glide:glide:4.13.1'
    kapt 'com.github.bumptech.glide:compiler:4.13.1'

    //CircleImageView（阅读界面/媒体弹窗里的圆形色块仍在用，体积很小，保留）
    implementation 'de.hdodenhof:circleimageview:3.1.0'


    //简繁转换
    implementation 'com.luhuiguo:chinese-utils:1.0'

    //epub
    implementation('com.positiondev.epublib:epublib-core:3.1') {
        exclude group: 'org.slf4j'
        exclude group: 'xmlpull'
    }

}

greendao {
    schemaVersion 68
    daoPackage 'com.kunfei.bookshelf.dao'
    targetGenDir 'src/main/java'
}

afterEvaluate {
//    for (Task task : project.tasks.matching { it.name.startsWith('crashlyticsUploadDeobs') }) {
//        task.enabled = false
//    }
}

